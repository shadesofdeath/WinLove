<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>WinLove — prototip</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg0:#1A1918;--bg1:#201E1C;--bg2:#292623;--bg3:#322E2A;--ov:#26231F;--in:#161514;--l1:#2E2B28;--l2:#423D38;--t1:#ECE7E0;--t2:#A39B91;--t3:#6F6861;--td:#524D47;--ink:#1A1210;--ac:#D4905A;--ach:#DE9F6C;--acp:#C27F4B;--acs:#3A2D22;--ok:#5CB874;--wa:#DDAA3E;--er:#E45A45;--inf:#6FA8DC;--oks:#233A2A;--was:#3B3220;--ers:#3E2622;--infs:#22303C;--scrim:#00000099;--sh1:#00000066;--sh2:#00000040;--row:24px;--ctl:24px}
[data-theme=light]{--bg0:#F5F2EE;--bg1:#ECE8E3;--bg2:#E3DED8;--bg3:#D9D3CC;--ov:#FFFFFF;--in:#FFFFFF;--l1:#DDD7D0;--l2:#C4BDB5;--t1:#211E1B;--t2:#625B54;--t3:#857D75;--td:#B3ABA3;--ink:#FFFFFF;--ac:#A85C24;--ach:#96511F;--acp:#84461A;--acs:#F1DCC9;--ok:#2E7D43;--wa:#8A6200;--er:#B93A2A;--inf:#2F6DA8;--oks:#DDEFE1;--was:#F5EAC9;--ers:#F6DAD5;--infs:#DAE7F3;--scrim:#00000066;--sh1:#00000033;--sh2:#0000001F}
[data-theme=hc]{--bg0:#000;--bg1:#000;--bg2:#1A1A1A;--bg3:#333;--ov:#000;--in:#000;--l1:#FFF;--l2:#FFF;--t1:#FFF;--t2:#FFF;--t3:#FFF;--td:#3FF23F;--ink:#000;--ac:#1AEBFF;--ach:#FFF;--acp:#1AEBFF;--acs:#1AEBFF;--ok:#3FF23F;--wa:#FFFF00;--er:#FF5050;--inf:#1AEBFF;--oks:#000;--was:#000;--ers:#000;--infs:#000;--scrim:#000000CC}
[data-theme=hc] .row.sel,[data-theme=hc] .nav a.act{color:#000}
[data-density=comfortable]{--row:28px;--ctl:28px}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg0);color:var(--t1);font:12px/16px "IBM Plex Sans","Segoe UI",sans-serif;overflow:hidden;min-width:1100px}
.mono{font-family:"JetBrains Mono","Cascadia Mono",monospace;font-size:11px}.t2{color:var(--t2)}.t3{color:var(--t3)}.s11{font-size:11px}
.app{display:grid;grid-template-rows:32px 1fr 24px;height:100vh}
.title{background:var(--bg1);border-bottom:1px solid var(--l1);display:flex;align-items:center;position:relative;-webkit-app-region:drag}
.title .brand{display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;height:32px}.title .sep{width:1px;height:12px;background:var(--l2)}
.crumb{display:flex;gap:6px;color:var(--t2)}.crumb i{color:var(--t3);font-style:normal}.crumb b{font-weight:400;color:var(--t1)}
.cmdk{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:280px;height:20px;border:1px solid var(--l2);border-radius:3px;background:var(--bg0);display:flex;align-items:center;gap:6px;padding:0 6px;color:var(--t3);font-size:11px;cursor:pointer}.cmdk:hover{border-color:var(--t3)}
kbd{font:10px/14px "JetBrains Mono",monospace;height:14px;padding:0 3px;border:1px solid var(--l2);border-radius:2px;color:var(--t3);display:inline-block}
.caps{margin-left:auto;display:flex;height:32px;color:var(--t2)}.caps button{width:46px;height:32px;border:0;background:none;color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}.caps button:hover{background:var(--bg2)}.caps button.x:hover{background:var(--er);color:#fff}
.tools{display:flex;align-items:center;gap:2px;margin-right:8px}.tools button{height:20px;padding:0 6px;border:1px solid var(--l2);border-radius:3px;background:none;color:var(--t2);font:inherit;font-size:11px;cursor:pointer}.tools button:hover{color:var(--t1);background:var(--bg2)}.tools button.on{color:var(--t1);border-color:var(--ac)}
.main{display:flex;min-height:0}
.nav{width:200px;background:var(--bg1);border-right:1px solid var(--l1);display:flex;flex-direction:column;padding:8px 0;flex-shrink:0;transition:width 220ms cubic-bezier(.2,0,0,1)}.nav.col{width:44px}
.nav .grp{padding:4px 0;border-bottom:1px solid var(--l1)}.nav a{position:relative;height:var(--row);display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;color:var(--t2);text-decoration:none;cursor:pointer;white-space:nowrap;overflow:hidden}
.nav a:hover{color:var(--t1)}.nav a.act{color:var(--t1)}.nav a.act::before{content:"";position:absolute;inset:0 4px;background:var(--bg2);border-radius:3px;z-index:-1}.nav a.act::after{content:"";position:absolute;left:4px;top:50%;margin-top:-6px;width:2px;height:12px;background:var(--ac)}
.nav a svg{flex-shrink:0;position:relative}.nav a span{flex:1;overflow:hidden;text-overflow:ellipsis}.nav a em{font:11px "JetBrains Mono",monospace;color:var(--t3)}.nav.col a span,.nav.col a em,.nav.col .foot span,.nav.col .foot kbd{display:none}
.nav .foot{margin-top:auto;height:24px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;color:var(--t3);cursor:pointer}.nav .foot kbd{margin-left:auto}
.content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.hdr{display:flex;align-items:flex-start;gap:8px;padding:16px 16px 0}.hdr h1{font-size:16px;line-height:22px;font-weight:600;margin:0}.hdr p{margin:2px 0 0;font-size:11px;color:var(--t2)}.hdr .acts{margin-left:auto;display:flex;gap:4px;flex-shrink:0}
.btn{height:var(--ctl);padding:0 8px;border:1px solid var(--l2);border-radius:3px;background:none;color:var(--t1);font:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}.btn:hover{background:var(--bg2)}.btn:active{background:var(--bg3)}.btn:focus-visible,.in:focus-within,.dd:focus-visible,.cb:focus-visible,.tg:focus-visible,.row:focus-visible{outline:1px solid var(--ac);outline-offset:1px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ink);font-weight:500}.btn.pri:hover{background:var(--ach)}.btn.pri:active{background:var(--acp)}.btn.sub{border-color:transparent;color:var(--t2)}.btn.dng{background:var(--er);border-color:var(--er);color:#fff;font-weight:500}.btn:disabled{opacity:.45;pointer-events:none}.btn.sm{height:20px;font-size:11px}
.tb{display:flex;align-items:center;gap:8px;padding:12px 16px}.tb .r{margin-left:auto;font-size:11px;color:var(--t2);white-space:nowrap}
.in{height:var(--ctl);border:1px solid var(--l2);border-radius:3px;background:var(--in);display:flex;align-items:center;gap:6px;padding:0 6px;color:var(--t3)}.in input{flex:1;min-width:0;border:0;background:none;color:var(--t1);font:inherit;outline:0}.in input::placeholder{color:var(--t3)}
.dd{height:var(--ctl);border:1px solid var(--l2);border-radius:3px;display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 8px;white-space:nowrap;cursor:pointer}.dd:hover{background:var(--bg2)}.dd span{color:var(--t2)}
.chip{height:var(--ctl);border:1px solid var(--ac);border-radius:3px;display:inline-flex;align-items:center;gap:6px;padding:0 4px 0 8px;white-space:nowrap}
.ib{display:flex;align-items:center;gap:8px;height:32px;margin:0 16px;padding:0 16px;border-top:1px solid var(--l1);border-bottom:1px solid var(--l1)}.ib.wa{background:var(--was)}.ib.er{background:var(--ers)}.ib.ok{background:var(--oks)}.ib.inf{background:var(--infs)}.ib b{font-weight:500}.ib>div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ib .r{margin-left:auto;color:var(--t2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap}
.cols{display:flex;height:24px;align-items:center;margin:8px 16px 0;border-bottom:1px solid var(--l1);font-size:11px;font-weight:500;color:var(--t3)}
.list{flex:1;min-height:0;overflow:auto;padding:0 16px 16px}.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--l2);border-radius:2px;border:2px solid var(--bg0)}
.row{height:var(--row);display:flex;align-items:center;border-radius:3px;position:relative;cursor:default;outline-offset:-1px}.row:hover{background:var(--bg2)}.row.sel{background:var(--acs)}.row.lines{border-bottom:1px solid var(--l1);border-radius:0}
.chev{width:16px;height:16px;color:var(--t3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.cb{width:16px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}.cb i{width:12px;height:12px;border-radius:2px;border:1px solid var(--l2);display:flex;align-items:center;justify-content:center}.cb.on i{background:var(--ac);border-color:var(--ac)}.cb.ind i{border-color:var(--ac)}.cb.ind i::after{content:"";width:6px;height:2px;background:var(--ac)}
.tg{width:24px;height:12px;border-radius:2px;border:1px solid var(--l2);position:relative;cursor:pointer;flex-shrink:0}.tg::after{content:"";position:absolute;top:1px;left:1px;width:8px;height:8px;border-radius:1px;background:var(--t2);transition:left 140ms cubic-bezier(.2,0,0,1)}.tg.on{background:var(--ac);border-color:var(--ac)}.tg.on::after{left:13px;background:var(--ink)}
.dot{width:6px;height:6px;border-radius:1px;flex-shrink:0}.low{background:var(--ok)}.med{background:var(--wa)}.high{background:var(--er)}
.ico{width:16px;height:16px;flex-shrink:0;color:var(--t2)}
.insp{width:280px;background:var(--bg1);border-left:1px solid var(--l1);display:flex;flex-direction:column;flex-shrink:0;overflow:auto}.insp .h{display:flex;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--l1);align-items:flex-start}.insp .h b{font-weight:500;display:block}.insp .h small{display:block}.insp section{padding:8px 16px;border-bottom:1px solid var(--l1)}.insp .kv{height:24px;display:flex;align-items:center;font-size:11px;color:var(--t2)}.insp .kv span{width:96px;flex-shrink:0}.insp .kv b{font-weight:400;color:var(--t1);display:flex;align-items:center;gap:6px}
.lab{height:24px;display:flex;align-items:center;font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--t2);text-transform:uppercase}
.status{background:var(--bg1);border-top:1px solid var(--l1);display:flex;align-items:center;gap:12px;padding:0 4px 0 12px;font-size:11px;color:var(--t2);white-space:nowrap}.status .sep{width:1px;height:12px;background:var(--l2)}.status .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.bar{height:2px;background:var(--l2);position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;height:2px;background:var(--ac)}.bar.ind i{width:25%;animation:ind 1.4s cubic-bezier(.2,0,0,1) infinite}@keyframes ind{from{left:-25%}to{left:100%}}
.cta{height:20px;padding:0 10px;border-radius:3px;background:var(--ac);color:var(--ink);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;border:0;font-family:inherit;cursor:pointer}.cta:hover{background:var(--ach)}.cta.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 2px var(--acs)}}.cta:disabled{background:var(--bg2);color:var(--td)}
.form{padding:0 16px;display:grid;grid-template-columns:240px 1fr;row-gap:8px;align-items:center}.form .sec{grid-column:1/-1;border-bottom:1px solid var(--l1);padding-top:8px}.form label{color:var(--t2)}.form .v{display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:4px;margin:0 16px;border-bottom:1px solid var(--l1)}.tabs a{height:24px;padding:0 12px;display:flex;align-items:center;color:var(--t2);cursor:pointer;position:relative;border-radius:3px 3px 0 0}.tabs a.on{color:var(--t1);font-weight:500;background:var(--bg2)}.tabs a.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:var(--ac)}
.log{flex:1;margin:0 16px 16px;background:var(--in);border:1px solid var(--l1);padding:8px 12px;overflow:auto;font:11px/20px "JetBrains Mono",monospace;color:var(--t2)}.log .ts{color:var(--t3)}.log .INFO{color:var(--inf)}.log .WARN{color:var(--wa)}.log .ERR{color:var(--er)}.log .DBG{color:var(--t3)}
.stats{display:flex;margin:0 16px;gap:8px}.stats div{flex:1;border-top:1px solid var(--l1);padding-top:4px}.stats small{color:var(--t2);font-size:11px}.stats b{display:block;font-size:16px;line-height:22px;font-weight:600}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--t2)}.empty b{color:var(--t1);font-weight:500;margin-top:16px}.empty .btn{margin-top:12px}
.drop{margin:8px 16px 0;border:1px solid var(--l2);border-radius:3px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--t2)}.drop.over{border-color:var(--ac);background:var(--acs)}
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;padding-top:120px;z-index:200}.scrim.show{display:flex}
.pal{width:560px;background:var(--ov);border:1px solid var(--l2);border-radius:4px;box-shadow:0 2px 4px var(--sh1),0 12px 32px var(--sh2);animation:pin 180ms cubic-bezier(0,0,0,1)}@keyframes pin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.pal .in{border:0;border-bottom:1px solid var(--l1);border-radius:0;height:40px;padding:0 16px;background:none}.pal .in input{font-size:12px}.pal .res{max-height:320px;overflow:auto;padding:8px 4px}.pal .it{height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:3px;cursor:pointer}.pal .it.on,.pal .it:hover{background:var(--bg2)}.pal .it div{flex:1;line-height:13px}.pal .it small{color:var(--t3);font-size:11px}.pal .lab{padding:0 12px}
.dlg{width:480px;background:var(--ov);border:1px solid var(--l2);border-radius:4px;box-shadow:0 2px 4px var(--sh1),0 12px 32px var(--sh2);padding:16px;margin-top:180px;animation:pin 180ms cubic-bezier(0,0,0,1)}.dlg h2{font-size:12px;font-weight:600;margin:0 0 8px;display:flex;gap:8px;align-items:center}.dlg p{margin:0 0 12px;color:var(--t2)}.dlg .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:16px}
.toast{position:fixed;right:16px;bottom:40px;width:360px;background:var(--ov);border:1px solid var(--l2);border-radius:4px;box-shadow:0 1px 2px var(--sh1),0 6px 16px var(--sh2);padding:8px 12px;display:flex;gap:8px;align-items:flex-start;z-index:300;animation:tin 180ms cubic-bezier(0,0,0,1)}@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}.toast b{font-weight:500;display:block}.toast small{color:var(--t2)}
.tip{position:fixed;background:var(--ov);border:1px solid var(--l2);border-radius:3px;padding:2px 6px;font-size:11px;color:var(--t1);box-shadow:0 1px 2px var(--sh1),0 4px 12px var(--sh2);pointer-events:none;z-index:120;display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:0s!important}}
</style></head>
<body data-theme="dark" data-density="compact">
<div class="app">
 <header class="title">
  <div class="brand"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--ac)" stroke-width="1.25" stroke-linejoin="round"><path d="M8 14L2 8V5l2-2h2l2 2 2-2h2l2 2v3z"/><path d="M5 8l3 3 3-3"/></svg><b style="font-weight:500">WinLove</b><span class="sep"></span><div class="crumb" id="crumb"></div></div>
  <div class="cmdk" onclick="openPal()"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M7 2.5a4.5 4.5 0 1 0 0 9a4.5 4.5 0 1 0 0-9z M10.5 10.5L14 14"/></svg><span style="flex:1" id="cmdkLabel">Komut, sayfa veya bileşen ara</span><kbd>Ctrl</kbd><kbd>K</kbd></div>
  <div class="caps"><div class="tools"><button onclick="setTheme('dark')" id="thD" class="on" data-tip="Koyu tema">Koyu</button><button onclick="setTheme('light')" id="thL" data-tip="Açık tema">Açık</button><button onclick="setTheme('hc')" id="thH" data-tip="Yüksek kontrast">HC</button><button onclick="toggleDensity()" id="den" data-tip="Yoğunluk: Compact / Comfortable">Compact</button><button onclick="setLang(lang==='tr'?'en':'tr')" id="lng" data-tip="Dil">TR</button></div>
   <button data-tip="Simge durumuna küçült"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M0 5.5h10"/></svg></button><button data-tip="Ekranı kapla"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="9" height="9"/></svg></button><button class="x" data-tip="Kapat"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M.5 .5l9 9M9.5 .5l-9 9"/></svg></button></div>
 </header>
 <div class="main"><nav class="nav" id="nav"></nav><main class="content" id="content"></main><aside class="insp" id="insp" style="display:none"></aside></div>
 <footer class="status" id="status"></footer>
</div>
<div class="scrim" id="palScrim" onclick="if(event.target===this)closePal()"><div class="pal"><div class="in"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M7 2.5a4.5 4.5 0 1 0 0 9a4.5 4.5 0 1 0 0-9z M10.5 10.5L14 14"/></svg><input id="palIn" placeholder="Komut, sayfa veya bileşen ara" autocomplete="off"><kbd>Esc</kbd></div><div class="res" id="palRes"></div></div></div>
<div class="scrim" id="dlgScrim" onclick="if(event.target===this)closeDlg()"><div class="dlg" id="dlg"></div></div>

function renderPal(){ const q=document.getElementById('palIn').value; const items=palItems(q); palIdx=Math.min(palIdx,items.length-1); let last=''; document.getElementById('palRes').innerHTML=items.length?items.map((it,i)=>{ const h=it.t!==last?`<div class="lab">${it.t}</div>`:''; last=it.t; return h+`<div class="it ${i===palIdx?'on':''}" onmousemove="palIdx=${i};renderPal()" onclick="runPal(${i})">${ic(it.i)}<div>${esc(it.n())}${it.sub?`<br><small>${it.sub}</small>`:''}</div>${it.k?`<kbd>${it.k}</kbd>`:i===palIdx?'<kbd>↵</kbd>':''}</div>`; }).join(''):`<div class="empty" style="padding:24px 0">${ic('search','var(--t3)')}<b>Sonuç yok</b><span class="s11">Sayfa adı, komut veya bileşen adı dene.</span></div>`; }

function openPal(){ document.getElementById('palScrim').classList.add('show'); const i=document.getElementById('palIn'); i.value=''; palIdx=0; renderPal(); i.focus(); }

document.getElementById('palIn').addEventListener('input',()=>{palIdx=0;renderPal();});
document.addEventListener('keydown',e=>{ const palOpen=document.getElementById('palScrim').classList.contains('show'); if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); palOpen?closePal():openPal(); return; } if(palOpen){ const n=palItems(document.getElementById('palIn').value).length; if(e.key==='ArrowDown'){palIdx=(palIdx+1)%n;renderPal();e.preventDefault();} else if(e.key==='ArrowUp'){palIdx=(palIdx-1+n)%n;renderPal();e.preventDefault();} else if(e.key==='Enter'){runPal(palIdx);} else if(e.key==='Escape'){closePal();} return; } if(e.key==='Escape'){ closeDlg(); if(selected){selected=null;renderTree();renderInsp();} } if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){ e.preventDefault(); navCol=!navCol; renderNav(); } if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){ const s=document.querySelector('.tb .in input'); if(s){ e.preventDefault(); s.focus(); } } if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='t'){ setTheme(document.body.dataset.theme==='dark'?'light':'dark'); } });
